[project]
name = "robotforge"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "yusenthebot", email = "89848950+yusenthebot@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "coacd>=1.0.14",
    "mcp>=2.3.0",
    "mujoco>=3.15.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "trimesh>=5.1.1",
]

[project.optional-dependencies]
# Play learned policies (ONNX), e.g. ones trained with UniLab: uv sync --extra policy
policy = ["onnxruntime>=1.20"]

[project.scripts]
robotforge = "robotforge:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
