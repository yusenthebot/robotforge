[project]
name = "robotforge"
version = "0.0.1"
description = "Add your description here"
authors = [
    { name = "yusenthebot", email = "89848950+yusenthebot@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "coacd>=1.0.14",
    "mcp>=2.3.0",
    "mujoco>=3.15.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "trimesh>=5.1.1",
]

[project.optional-dependencies]
# Deep reinforcement learning (PPO, SAC) on the built-in tasks; the core install never imports these.
# On Linux, PyPI's default torch wheel is the large CUDA build; docs/ALGORITHMS.md shows the CPU-only index.
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.4,<3",  # control/rl/train.py builds on SubprocVecEnv internals
    "torch>=2.5",
]
# Play learned policies (ONNX), e.g. ones trained with UniLab: uv sync --extra policy
policy = ["onnxruntime>=1.20"]
# Run ZenoBench (Isaac Sim tasks for Zeno Malo) on MuJoCo without Isaac: uv sync --extra zenobench
# usd-core reads the USD scenes; the rest are ZenoBench's own runtime imports.
zenobench = [
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",
    "ompl>=2.0.1",
    "opencv-python-headless>=4.11",
    "scipy>=1.15",
    "usd-core>=25.5",
]

[project.scripts]
robotforge = "robotforge:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (lessons that train for a minute or more) stay out of the default run; `-m slow` runs them.
# Browser tests drive the real viewer in headless Google Chrome; `-m browser` runs them (not yet in CI).
addopts = "-m 'not slow and not browser'"
markers = [
    "slow: plays something that takes a minute or more; run with -m slow",
    "browser: drives the real viewer in headless Google Chrome; run with -m browser",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
