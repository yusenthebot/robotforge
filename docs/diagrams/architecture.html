<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>robotforge · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · robotforge</p>
    <h1>How robotforge runs a robot</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">How robotforge runs a robot</title>
        <desc id="architecture-desc">Architecture diagram showing an LLM agent calling robotforge's MCP server, which builds the world, sets behaviors and steps a single MuJoCo session that streams body poses to a thin three.js browser viewer.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: the one local Python process (drawn before arrows and nodes) -->
        <rect x="176" y="124" width="592" height="352" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="192" y="128" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="250" y="137" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">LOCAL PYTHON PROCESS</text>

        <!-- Arrows first (behind boxes) -->
        <!-- Agent -> MCP server -->
        <line x1="152" y1="300" x2="200" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- MCP server fans out from three ports on its right edge -->
        <path d="M 320,288 H 448 Q 456,288 456,280 V 212"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="300" x2="600" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 320,312 H 448 Q 456,312 456,320 V 388"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- World builder -> Sim session (compiled model enters the top edge) -->
        <path d="M 532,184 H 664 Q 672,184 672,192 V 272"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Behaviors -> Sim session (controls enter the bottom edge) -->
        <path d="M 532,416 H 664 Q 672,416 672,408 V 328"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Robot library -> World builder, fetched over the network -->
        <line x1="456" y1="96" x2="456" y2="156" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Sim session <-> Browser over WebSocket -->
        <line x1="744" y1="288" x2="816" y2="288" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="816" y1="312" x2="744" y2="312" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>

        <!-- Arrow labels (masked, 8px gap from their stroke) -->
        <rect x="464" y="104" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="482" y="113" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FETCH</text>

        <rect x="464" y="240" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="249" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ROBOT · SCENE</text>

        <rect x="486" y="280" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="528" y="289" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STEP · OBSERVE</text>

        <rect x="464" y="344" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="490" y="353" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SET · RUN</text>

        <rect x="680" y="224" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="696" y="233" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MJCF</text>

        <rect x="680" y="364" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="696" y="373" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CTRL</text>

        <rect x="762" y="268" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="780" y="277" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POSES</text>

        <rect x="762" y="320" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="780" y="329" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INPUT</text>

        <!-- Node: Agent (input) -->
        <rect x="40" y="272" width="112" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="272" width="112" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="48" y="280" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="62" y="289" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
        <text x="96" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Agent</text>
        <text x="96" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Claude · GPT</text>

        <!-- Node: MCP server (backend) -->
        <rect x="200" y="272" width="120" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="200" y="272" width="120" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="208" y="280" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="222" y="289" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
        <text x="260" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MCP server</text>
        <text x="260" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stdio · 50 tools</text>

        <!-- Node: Robot library (external) -->
        <rect x="380" y="40" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="40" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="388" y="48" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="402" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="456" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Robot library</text>
        <text x="456" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Menagerie · first use</text>

        <!-- Node: World builder (backend) -->
        <rect x="380" y="156" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="156" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="164" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="406" y="173" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>
        <text x="456" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">World builder</text>
        <text x="456" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">world.yaml → MJCF</text>

        <!-- Node: Behaviors (backend) -->
        <rect x="380" y="388" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="388" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="396" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="404" y="405" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CTRL</text>
        <text x="456" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Behaviors</text>
        <text x="456" y="436" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">IK · MPC · RL · scripts</text>

        <!-- Node: Sim session (focal) -->
        <rect x="600" y="272" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="272" width="144" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="608" y="280" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="622" y="289" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SIM</text>
        <text x="672" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sim session</text>
        <text x="672" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MuJoCo · real time</text>

        <!-- Node: Browser (external) -->
        <rect x="816" y="272" width="104" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="816" y="272" width="104" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="824" y="280" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="836" y="289" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="868" y="306" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Browser</text>
        <text x="868" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">three.js viewer</text>

        <!-- Editorial callout, top-right margin -->
        <text x="920" y="68" fill="#2d3142" font-size="14" font-style="italic"
              font-family="'Instrument Serif', serif" text-anchor="end">one physics runtime; the browser only draws</text>
        <path d="M 812,78 Q 800,200 728,268" fill="none"
              stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="728" cy="268" r="2" fill="#2d3142"/>

        <!-- Legend strip -->
        <line x1="40" y1="508" x2="920" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="540" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Physics (focal)</text>

        <rect x="168" y="540" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="188" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Python module</text>

        <rect x="284" y="540" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="304" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">LLM agent</text>

        <rect x="380" y="540" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="400" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Outside the process</text>

        <line x1="528" y1="545" x2="556" y2="545" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="564" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Network (WS, HTTPS)</text>

        <line x1="692" y1="545" x2="720" y2="545" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="728" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">In-process call</text>

        <line x1="836" y1="545" x2="864" y2="545" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
        <text x="872" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Input</text>
      </svg>
    </div>
  </div>
</body>
</html>
