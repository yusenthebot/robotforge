name: CI

# The repo is private (2026-10-19) and Actions minutes cost money there, with Windows at twice the rate.
# Every landing already runs ruff, the suite and smoke locally (scripts/land.py), so CI runs only when
# asked: at the end of a milestone, `gh workflow run CI --ref main`, to check Ubuntu and Windows.
on:
  workflow_dispatch:

# A running run finishes; only the newest waiting request runs after it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40  # Windows runs the suite in about 20 min; a cancelled run reads as a failure
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux gets a software OpenGL (Mesa llvmpipe) so the rendering tests really run.
          - os: ubuntu-latest
            gl: egl
            require_gl: "1"
          # Windows runners have no usable OpenGL: rendering tests skip and observe degrades to state + note.
          - os: windows-latest
            gl: ""
            require_gl: ""
    env:
      MUJOCO_GL: ${{ matrix.gl }}
      ROBOTFORGE_REQUIRE_GL: ${{ matrix.require_gl }}
      UV_FROZEN: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Mesa EGL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libgles2 libegl-mesa0 libgl1-mesa-dri

      - name: Install dependencies
        run: uv sync --frozen

      - name: Report offscreen OpenGL status
        run: uv run python -c "from robotforge.sim.render import render_unavailable_reason as r; print('offscreen OpenGL:', r() or 'available')"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q -ra

      - name: Headless smoke test
        run: uv run python scripts/smoke.py

      # Lessons that train for a minute or more (playthroughs of RL I, RL II, the MPC twins) are marked slow and
      # stay out of the default run; play them once here, on the faster runner.
      - name: Slow lesson playthroughs
        if: runner.os == 'Linux' && (success() || failure())
        run: uv run pytest -q -ra -m slow

      # Learned walking policies need the optional extra; their tests skip without it, so run them once more with it.
      - name: Learned policies (extra policy = onnxruntime)
        if: success() || failure()  # independent of the main test run's result
        run: uv run --extra policy pytest -q -ra tests/test_onnx_policy.py

      # PPO and SAC need the optional rl extra (PyTorch); their adapter tests skip without it. Linux gets the CPU-only
      # build (PyPI's default there is the CUDA one, several GB); the other runners' default is already CPU.
      - name: PPO and SAC adapters (extra rl = PyTorch, CPU build)
        if: runner.os == 'Linux' && (success() || failure())
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install "gymnasium>=1.0" "stable-baselines3>=2.4,<3"
          uv run --no-sync pytest -q -ra tests/test_training_sb3.py

      - name: PPO and SAC adapters (extra rl = PyTorch)
        if: runner.os != 'Linux' && (success() || failure())
        run: uv run --extra rl pytest -q -ra tests/test_training_sb3.py
